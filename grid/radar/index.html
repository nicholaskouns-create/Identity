<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid · Live Doppler radar</title><link rel="stylesheet" href="../lib/maplibre/maplibre-gl.css"><style>body{margin:0;background:#101820;color:#eee;font:15px system-ui}header{padding:12px}a{color:#8de5ff}button,input{margin:6px}#map{height:65vh}#controls{padding:10px}button{padding:8px}</style><header><a href="../">← Grid</a> · NOAA MRMS live color radar · <a href="https://radar.weather.gov/">Official NOAA radar</a><div id="status" role="status">Loading map</div></header><div id="map"></div><div id="controls"></div><script type="module">import * as lib from '../lib/maplibre/maplibre-gl.mjs';import {mountRadar} from '../live/radar.js';const M=lib.default||lib;const status=document.querySelector('#status');try{const map=new M.Map({container:'map',style:{version:8,sources:{base:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Esri'}},layers:[{id:'base',type:'raster',source:'base'}]},center:[-98,39],zoom:3.5});map.on('load',()=>{const radar=mountRadar(map,document.querySelector('#controls'),(id,state,msg)=>status.textContent=msg,()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:8}),()=>status.textContent='Location unavailable; pan to your region'):null,()=>map.fitBounds([[-125,24],[-66,50]],{padding:20}));radar.set(true)});map.on('error',e=>status.textContent=e.error?.message||'Map source error')}catch(e){status.textContent=e.message}</script></html>
