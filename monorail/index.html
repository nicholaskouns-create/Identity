<style>
:root{
  --ink:#0c1724; --ink2:#132236; --edge:#24364f; --fg:#e8eef6;
  --dim:#9fb2c9; --faint:#71869f; --gold:#d8a94a; --ok:#5fcf9e;
  --warn:#e0975a; --bad:#e86a6a;
  --display:"Newsreader",Georgia,serif;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --ink:#f3efe6; --ink2:#fbf9f4; --edge:#d6cdb9; --fg:#17212e;
  --dim:#4c5b6d; --faint:#78879a; --gold:#8a6512; --ok:#1d7a53;
  --warn:#9a5a16; --bad:#a32b2b; color-scheme:light;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
a{color:inherit}
button,input[type=range]{cursor:pointer}
main{max-width:48rem;margin:0 auto;padding:2.5rem 1rem 5rem}
h1{font-family:var(--display);font-weight:600;font-size:2.25rem;line-height:1;margin:.4rem 0 0}
h2{font-family:var(--display);font-weight:600;font-size:1.5rem;margin:0}
.kicker{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
.dim{color:var(--dim)} .faint{color:var(--faint)} .gold{color:var(--gold)}
.bad{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}
.mono{font-family:var(--mono)}
.lede{max-width:36rem;color:var(--dim)}
.sec{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--edge)}
.n{font-family:var(--mono);font-size:.85rem;color:var(--gold);margin-right:.5rem}
.note{border-left:4px solid var(--gold);background:var(--ink2);padding:.75rem 1rem}
.card{display:block;border:1px solid var(--edge);background:var(--ink2);padding:.75rem 1rem;text-decoration:none}
.card:hover{border-color:var(--gold)}
.stack{display:grid;gap:.75rem;margin-top:1rem}
.doors{list-style:none;margin:1rem 0 0;padding:0;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.doors a{display:flex;gap:.75rem;align-items:baseline;padding:.75rem 0;text-decoration:none;border-bottom:1px solid var(--edge)}
.doors li:last-child a{border-bottom:0}
.doors a:hover{color:var(--gold)}
.num{font-family:var(--mono);font-size:.75rem;color:var(--faint);width:2rem;flex:none}
.frame{height:70vh;width:100%;border:0;background:var(--ink)}
.exits{list-style:none;margin:0;padding:0;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.exits li{display:flex;justify-content:space-between;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--edge)}
.exits li:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.75rem;text-align:left}
th,td{border-bottom:1px solid var(--edge);padding:.5rem .75rem .5rem 0}
th{color:var(--gold);font-weight:500}
.bar{height:.4rem;background:var(--edge);margin-top:.4rem}
.bar > span{display:block;height:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.75rem 1rem;margin-top:1rem}
.stepper{width:100%;accent-color:var(--gold);margin-top:.75rem}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
</style>

function esc(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));}
function sci(v){return v === 0 ? "0" : v.toExponential(3);}
function q(v){return Math.floor(v / ULP + 0.5) * ULP;}
function initial(){
  const raw = Array.from({length:125}, (_, i) => ((17 * i + 3) % 97) - 48);
  const mean = raw.reduce((a,b)=>a+b,0) / raw.length;
  const c = raw.map(v => v - mean);
  const norm = Math.sqrt(c.reduce((a,v)=>a+v*v,0));
  return c.map(v => v / norm);
}
function frameAt(n){
  let x = initial();
  let xq = x.map(q);
  for (let s = 0; s < n; s++){
    x = x.map((v,i) => v * LAM[i]);
    xq = xq.map((v,i) => q(v * LAM[i]));
  }
  const comp = arr => Math.sqrt(arr.reduce((a,v,i)=> a + (KEEP[i] ? 0 : v*v), 0));
  const ker = arr => Math.sqrt(arr.reduce((a,v,i)=> a + (KEEP[i] ? v*v : 0), 0));
  let dx = 0;
  for (let i = 0; i < x.length; i++){ const d = x[i]-xq[i]; dx += d*d; }
  return {n, floatR: comp(x), fixedR: comp(xq), dx: Math.sqrt(dx), kernel: ker(x), kernelQ: ker(xq), bound: RHO ** n};
}

function hash(){
  const h = location.hash.replace(/^#/, "") || "/";
  const p = h.split("/").filter(Boolean);
  if (p[0] === "s" && p[1]) return {view:"station", slug:p[1]};
  if (p[0] === "repair" && p[1]) return {view:"repair", id:p[1]};
  if (p[0] === "richardson") return {view:"richardson"};
  return {view:"home"};
}
function go(hash){ location.hash = hash; }

function home(){
  const repairs = DATA.repairs.map(r =>
    `<a class="card" href="#/repair/${esc(r.id)}"><span class="mono bad">${esc(r.status)}</span> <span style="font-family:var(--display);font-size:1.15rem">${esc(r.title)}</span><span class="dim" style="display:block;margin-top:.25rem;font-size:.9rem">${esc(r.foundOn)}</span></a>`
  ).join("");
  const doors = DATA.stations.map((s,i) =>
    `<li><a href="#/s/${esc(s.slug)}"><span class="num">${String(i+1).padStart(2,"0")}</span><span><span style="display:block">${esc(s.name)}</span><span class="dim" style="font-size:.9rem">${esc(s.kicker)}</span></span></a></li>`
  ).join("");
  return `
    <p class="kicker">Elevated Reproducibility Monorail</p>
    <h1>Gestalt corpus</h1>
    <p class="lede">Seventeen doors on the live City, followed through their links. The apps stay where they are. Only what failed is replaced, and nothing private was invented to fill a gap.</p>
    <p><a class="gold" href="#/richardson">Run the Richardson contraction</a></p>
    <p class="mono faint" style="font-size:.75rem">29 October 2026 · 17 doors · 177 links followed · 4 failures</p>
    <section class="sec"><h2><span class="n">01</span>What the set actually is</h2>
      <div class="lede" style="margin-top:.75rem">
        <p>One claim, several instruments. A 125-state carrier keeps a 47-dimensional kernel. Identity holds the formal layer and the machine-checked plate. The City index mounts the instruments. The clock, the matrix, the neutrino snapshot, the planetarium, and the tower are those instruments, not separate theories.</p>
        <p>Mnemosyne is the archive of that layer: certificates, a 128-kernel census, and a recorded negative result about evidence substitution. SPECTRA is a thin door onto the same host that serves the City apps. NOESIS is a registry. Lucas is the plain door into the Fibonacci–Lucas tower. Live Work is the index that admits all of this is still being run.</p>
        <p>The Observatory in learn view is static. It compares instruments and does not write the database. The porch, the City, and Live Work are three maps of one set.</p>
      </div>
    </section>
    <section class="sec"><h2><span class="n">02</span>What is not running</h2>
      <div class="note" style="margin-top:.75rem"><p>The monorail receipt ledger is not deployed. <span class="mono">city_formalism.monorail_receipts</span> does not exist in production. Receipts are unsigned. <span class="mono">KX-E47-KERNEL</span> certifies its stations and still fails reconciliation, so it is limited service, not open. No independent validators. Threat 20 stands: a privileged role can disable the chain triggers. The browser check exists because of that, not in spite of it.</p></div>
      <p class="dim" style="margin-top:.75rem">The carrier bridge connects the weight data of the 125-state operator to the block split that yields 47. It does not yet connect the eigenspaces. <span class="mono">[C, Z] = 0</span> is in. <span class="mono">[C, U] = 0</span>, <span class="mono">[C, D] = 0</span>, and <span class="mono">dim ker K = 47</span> for the full Casimir remain open. Six of nine theorem identifiers match no City citizen. They are reported, not created.</p>
    </section>
    <section class="sec"><h2><span class="n">03</span>Four links that failed</h2><div class="stack">${repairs}</div></section>
    <section class="sec"><h2><span class="n">04</span>The doors</h2>
      <p class="dim" style="font-size:.9rem">Open a door to run the live app in the frame, with its broken exits already redirected.</p>
      <ol class="doors">${doors}</ol>
    </section>`;
}

function station(slug){
  const s = DATA.stations.find(x => x.slug === slug);
  if (!s) return missing("No such door");
  const exits = s.links.map(l => {
    // A historical 401 is an authorization boundary, not a locally replaced source.
    const restricted = l.state === "restricted" && DATA.repairs.some(r => r.id === l.repair && r.status === "401");
    const dest = (l.state === "repaired" || l.state === "restricted") && l.repair
      ? `<a class="mono warn" href="#/repair/${esc(l.repair)}">${restricted ? "Owner-only source · public alternatives" : "Repair details"}</a>`
      : `<a class="mono faint" href="${esc(l.href)}">${esc(l.href.replace(/^https:\/\//,""))}</a>`;
    const tag = l.state === "live" ? `<span class="mono ok">Live</span>` : restricted ? `<span class="mono warn">Restricted</span>` : `<span class="mono warn">Repair</span>`;
    return `<li><span style="min-width:0"><span style="display:block">${esc(l.label)}</span>${dest}</span>${tag}</li>`;
  }).join("");
  return `
    <a class="kicker" href="#/">Corpus</a>
    <p class="mono faint" style="margin-top:1rem;font-size:.75rem">${esc(s.kicker)}</p>
    <h1>${esc(s.name)}</h1>
    <p class="lede">${esc(s.gist)}</p>
    <p><a class="mono gold" href="${esc(s.href)}">${esc(s.href)}</a></p>
    <div style="margin-top:1.25rem;border:1px solid var(--edge);background:var(--ink2)">
      <iframe class="frame" title="${esc(s.name)}" src="${esc(s.href)}"></iframe>
    </div>
    <p class="faint" style="font-size:.75rem">The frame is the live page. If it stays blank, the site refused to be embedded. The link above still opens it.</p>
    <h2 style="margin-top:2rem">Exits</h2>
    <ul class="exits">${exits}</ul>`;
}

function repair(id){
  const r = DATA.repairs.find(x => x.id === id);
  if (!r) return missing("No such repair");
  const restricted = r.status === "401";
  const dest = r.redirects.map(d =>
    `<li style="display:block"><a href="${esc(d.href)}"><span style="display:block">${esc(d.label)}</span><span class="mono faint">${esc(d.href.replace(/^https:\/\//,""))}</span></a></li>`
  ).join("");
  return `
    <a class="kicker" href="#/">Corpus</a>
    <p class="mono bad" style="margin-top:1rem;font-size:.75rem">${esc(r.status)} · ${restricted ? "restricted source, not replaced" : "historical broken link"}</p>
    <h1>${esc(r.title)}</h1>
    <p style="max-width:36rem">${esc(r.why)}</p>
    <p class="mono faint" style="font-size:.75rem;word-break:break-all">${esc(r.failed)}</p>
    <p class="dim" style="font-size:.9rem">Found on ${esc(r.foundOn)}.</p>
    ${restricted ? `<p class="dim" style="font-size:.9rem">Google Drive permission metadata checked 30 October 2026: owner-only. Whether this restriction was intentional is unknown. The public links below are separate records, not a replacement for or validation of the restricted file.</p>` : ""}
    <div class="note" style="margin-top:1.5rem"><p class="faint" style="font-size:.85rem">Construction</p><p>${esc(r.construction)}</p></div>
    <h2 style="margin-top:2rem">Where to go instead</h2>
    <ul class="exits">${dest}</ul>`;
}

function richardson(){
  return `
    <a class="kicker" href="#/">Corpus</a>
    <p class="mono faint" style="margin-top:1rem;font-size:.75rem">V₂⊗³ · diagonal in the Casimir basis</p>
    <h1>Richardson contraction</h1>
    <p class="lede">One hundred twenty-five independent multiplies. Total spin 2 and 5 stay put. Every other mode is multiplied by a factor no larger than 15/17. Floating point keeps going. Q4.28, rounded to 2⁻²⁸ after each step, hits a floor and stays there.</p>
    <p class="dim" style="font-size:.9rem">The same recurrence is <a class="gold" href="../formal/e47/richardson/richardson_sim.py">richardson_sim.py</a>. From a clone: <span class="mono">python3 formal/e47/richardson/richardson_sim.py</span></p>
    <div class="note" style="margin-top:1.25rem">
      <div class="row"><label class="mono faint" for="steps">Iteration</label><span class="mono gold" id="nlabel">${stepN}</span></div>
      <input id="steps" class="stepper" type="range" min="0" max="250" value="${stepN}">
    </div>
    <div id="rich-body">${richBody()}</div>`;
}
function richBody(){
  const f = frameAt(stepN);
  const rows = MARKS.map(frameAt);
  const bars = SECTORS.map(s => {
    const amp = Math.abs(s.multiplier) ** stepN;
    const w = s.retain ? 100 : Math.max(0, amp * 100);
    const color = s.retain ? "var(--gold)" : "var(--ok)";
    return `<li style="padding:.75rem 0;border-bottom:1px solid var(--edge)">
      <div class="row"><span>J = ${s.j} <span class="mono faint">${s.retain ? "retain" : "contract"} · ×${s.mult}</span></span><span class="mono faint">${sci(amp)}</span></div>
      <div class="bar"><span style="width:${w}%;background:${color}"></span></div></li>`;
  }).join("");
  const table = rows.map(r => `<tr style="${r.n===stepN?"color:var(--gold)":""}"><td>${r.n}</td><td>${sci(r.floatR)}</td><td>${sci(r.fixedR)}</td><td>${sci(r.bound)}</td></tr>`).join("");
  return `
      <dl class="stats">
        <div><dt class="faint" style="font-size:.75rem">Float complement</dt><dd class="mono">${sci(f.floatR)}</dd></div>
        <div><dt class="faint" style="font-size:.75rem">Q4.28 complement</dt><dd class="mono">${sci(f.fixedR)}</dd></div>
        <div><dt class="faint" style="font-size:.75rem">‖Δx‖</dt><dd class="mono">${sci(f.dx)}</dd></div>
        <div><dt class="faint" style="font-size:.75rem">(15/17)ⁿ</dt><dd class="mono">${sci(f.bound)}</dd></div>
        <div><dt class="faint" style="font-size:.75rem">Kernel, float</dt><dd class="mono">${f.kernel.toFixed(6)}</dd></div>
        <div><dt class="faint" style="font-size:.75rem">Kernel, Q4.28</dt><dd class="mono">${f.kernelQ.toFixed(6)}</dd></div>
      </dl>
    <h2 style="margin-top:2rem">Sectors at this step</h2>
    <ul style="list-style:none;padding:0;margin:0;border-top:1px solid var(--edge)">${bars}</ul>
    <h2 style="margin-top:2rem">The same vector, sampled</h2>
    <p class="dim" style="font-size:.9rem">Coordinates are (17i+3) mod 97, centered and normalized. The plate’s printed column used a different initial vector. The envelope (15/17)ⁿ is the worst mode.</p>
    <div style="overflow-x:auto"><table><thead><tr><th>n</th><th>float</th><th>Q4.28</th><th>(15/17)ⁿ</th></tr></thead><tbody>${table}</tbody></table></div>
    <p class="dim" style="margin-top:1rem">Worst multiplier is ${RHO.toFixed(12)}, which is 15/17 with no remainder. After 250 steps the float complement is about 10⁻¹⁴. Q4.28 stops near 1.08×10⁻⁷ for this vector. The kernel norm does not move.</p>`;
}

function missing(msg){
  return `<h1>${esc(msg)}</h1><p><a class="gold" href="#/">Back to the corpus</a></p>`;
}

function render(){
  const r = hash();
  const app = document.getElementById("app");
  if (r.view === "station") app.innerHTML = station(r.slug);
  else if (r.view === "repair") app.innerHTML = repair(r.id);
  else if (r.view === "richardson") app.innerHTML = richardson();
  else app.innerHTML = home();
  const slider = document.getElementById("steps");
  if (slider && !slider.dataset.bound){
    slider.dataset.bound = "1";
    slider.addEventListener("input", e => {
      stepN = Number(e.target.value);
      const label = document.getElementById("nlabel");
      if (label) label.textContent = String(stepN);
      const body = document.getElementById("rich-body");
      if (body) body.innerHTML = richBody();
    });
  }
  if (r.view !== "richardson") window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
