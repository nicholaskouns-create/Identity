name: E47 concrete weight-3 Casimir paired audit
on:
  pull_request:
    paths:
      - 'formal/e47/unified/ConcreteWeight3Casimir.lean'
      - 'formal/e47/unified/ConcreteWeight3Casimir.v'
      - 'validation/e47_weight3_casimir.py'
      - '.github/workflows/e47-weight3-casimir.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-weight3:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.19.0
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and audit concrete 125-state weight-3 proof
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee weight3-lean-commit.txt
          sha256sum formal/e47/unified/Tensor125.lean formal/e47/unified/ConcreteWeight3Casimir.lean | tee weight3-lean-sha256.txt
          lean --version | tee weight3-lean-version.txt
          grep -Fq 'Lean (version 4.19.0' weight3-lean-version.txt
          lean -o "$RUNNER_TEMP/Tensor125.olean" formal/e47/unified/Tensor125.lean 2>&1 | tee weight3-lean-import-log.txt
          LEAN_PATH="$RUNNER_TEMP" lean formal/e47/unified/ConcreteWeight3Casimir.lean 2>&1 | tee weight3-lean-log.txt
          grep -Fq 'E47ConcreteWeight3.concrete_quartic_annihilator' weight3-lean-log.txt
          ! grep -Eq 'sorryAx|Lean.ofReduceBool|native_decide.ax' weight3-lean-log.txt
          ! grep -Eq '^[[:space:]]*(sorry|axiom)\b' formal/e47/unified/ConcreteWeight3Casimir.lean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e47-weight3-lean-unsigned
          path: weight3-lean-*.txt
  coq-weight3:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq 8.18.0
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq coq
      - name: Compile and audit concrete 125-state weight-3 proof
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee weight3-coq-commit.txt
          sha256sum formal/e47/unified/Tensor125.v formal/e47/unified/ConcreteWeight3Casimir.v | tee weight3-coq-sha256.txt
          coqc --version | tee weight3-coq-version.txt
          grep -Fq 'version 8.18.0' weight3-coq-version.txt
          coqc -q -Q formal/e47/unified E47 formal/e47/unified/Tensor125.v 2>&1 | tee weight3-coq-import-log.txt
          coqc -q -Q formal/e47/unified E47 formal/e47/unified/ConcreteWeight3Casimir.v 2>&1 | tee weight3-coq-log.txt
          test "$(grep -c 'Closed under the global context' weight3-coq-log.txt)" -eq 8
          ! grep -Eq 'Admitted\.|Axiom ' formal/e47/unified/ConcreteWeight3Casimir.v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e47-weight3-coq-unsigned
          path: weight3-coq-*.txt
  python-weight3:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent integer charpoly and negative control
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee weight3-python-commit.txt
          sha256sum validation/e47_weight3_casimir.py | tee weight3-python-sha256.txt
          python --version | tee weight3-python-version.txt
          python -I validation/e47_weight3_casimir.py 2>&1 | tee weight3-python-log.txt
          grep -Fq 'E47_WEIGHT3_INVARIANCE_PASS' weight3-python-log.txt
          grep -Fq 'E47_WEIGHT3_CHARPOLY_EXACT_PASS' weight3-python-log.txt
          grep -Fq 'E47_WEIGHT3_MUTANT_REJECTED' weight3-python-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e47-weight3-python-unsigned
          path: weight3-python-*.txt
