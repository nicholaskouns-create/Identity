name: E47 axiom ledger

# The other workflows grep for `sorry` and `admit`. That catches an
# unfinished proof but not one closed by `native_decide`, which compiles the
# claim to native code, runs it, and mints a fresh axiom asserting the result.
# A file can be green and still trust the compiler rather than the kernel.
#
# This gate reads every `#print axioms` line and classifies it. Two tiers:
#
#   hard fail   sorryAx, a user-declared axiom, or a native_decide axiom in
#               any file not named in --allow-native
#   tracked     native_decide in an allowed file: reported with a count, so
#               the gap is carried explicitly instead of passing in silence
#
# E47ConcreteMatrix.lean is the one allowed file today: its five headline
# theorems close with native_decide. Remove it from the allow list once those
# are kernel-checked and the gate tightens by itself.

on:
  push:
    paths:
      - 'formal/e47/**'
      - 'scripts/axiom_ledger.py'
      - '.github/workflows/e47-axiom-ledger.yml'
  pull_request:
    paths:
      - 'formal/e47/**'
      - 'scripts/axiom_ledger.py'
      - '.github/workflows/e47-axiom-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Fast gate: everything that does not need Mathlib. No allowance granted —
  # any native_decide appearing here is a regression and fails the run.
  core-ledger:
    name: Mathlib-free files — no native_decide permitted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Audit axioms
        shell: bash
        run: |
          set -euo pipefail
          # All three files importing Mathlib must use the pinned Lake environment.
          # Fail on partition drift rather than silently skipping future imports.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("formal/e47")
          actual = {p.name for p in root.rglob("*.lean")
                    if re.search(r"(?m)^\s*import\s+Mathlib(?:\s|$)", p.read_text())}
          expected = {"E47ConcreteMatrix.lean", "E47Kernel29.lean", "E47Richardson.lean"}
          assert actual == expected, f"Mathlib audit partition drift: {sorted(actual ^ expected)}"
          print("Mathlib files routed to Lake:", ", ".join(sorted(actual)))
          PY
          mapfile -t FILES < <(find formal/e47 -name '*.lean' \
            ! -name 'E47ConcreteMatrix.lean' ! -name 'E47Kernel29.lean' \
            ! -name 'E47Richardson.lean' | sort)
          python3 scripts/axiom_ledger.py "${FILES[@]}" | tee axiom-ledger-core.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-ledger-core
          path: axiom-ledger-core.txt

  # Mathlib concrete files need the compilation cache. Only
  # E47ConcreteMatrix has a tracked native_decide allowance.
  concrete-ledger:
    name: Mathlib certificates — native_decide tracked only in concrete matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        working-directory: formal/e47-concrete
        run: |
          set -euo pipefail
          lake update
          test -f lake-manifest.json
      - name: Retrieve Mathlib compilation cache
        working-directory: formal/e47-concrete
        run: lake exe cache get
      - name: Audit axioms
        shell: bash
        working-directory: formal/e47-concrete
        run: |
          set -euo pipefail
          python3 ../../scripts/axiom_ledger.py \
            --lean-cmd "lake env lean" \
            --allow-native ../e47/E47ConcreteMatrix.lean \
            ../e47/E47ConcreteMatrix.lean ../e47/E47Kernel29.lean | tee ../../axiom-ledger-concrete.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-ledger-concrete
          path: axiom-ledger-concrete.txt


  # Separate fast certificate: Richardson cannot be blocked behind the
  # expensive concrete 125x125 native_decide matrix audit.
  richardson-lean:
    name: Richardson Lean 4.35 — Mathlib compilation and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib
        working-directory: formal/e47-concrete
        run: |
          set -euo pipefail
          lake update
          test -f lake-manifest.json
      - name: Retrieve Mathlib compilation cache
        working-directory: formal/e47-concrete
        run: lake exe cache get
      - name: Compile and audit nine Richardson theorems without native allowance
        working-directory: formal/e47-concrete
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp ../e47/E47Richardson.lean "$tmp/E47Richardson.lean"
          cat >> "$tmp/E47Richardson.lean" <<'LEAN'
          #print axioms E47Richardson.step_minimax
          #print axioms E47Richardson.stability_window
          #print axioms E47Richardson.slow_sector
          #print axioms E47Richardson.fast_sector
          #print axioms E47Richardson.retained_two
          #print axioms E47Richardson.retained_five
          #print axioms E47Richardson.normalized_identity
          #print axioms E47Richardson.complement_envelope
          #print axioms E47Richardson.complement_bound_attained
          LEAN
          sha256sum ../e47/E47Richardson.lean "$tmp/E47Richardson.lean" | tee ../../richardson-source-sha256.txt
          python3 ../../scripts/axiom_ledger.py --lean-cmd "lake env lean" \
            "$tmp/E47Richardson.lean" | tee ../../axiom-ledger-richardson.txt
          grep -q '(9 audited)' ../../axiom-ledger-richardson.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axiom-ledger-richardson
          path: |
            axiom-ledger-richardson.txt
            richardson-source-sha256.txt

  # Paired Coq compilation for the Richardson file merged in PR #95.
  # The previous green formal-validation workflow did not compile this file.
  richardson-coq:
    name: Richardson Coq 8.18 — compile and audit assumptions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq coq
          coqc --version
      - name: Compile nine Richardson theorems and print assumptions
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp formal/e47/E47Richardson.v "$tmp/E47Richardson.v"
          cat >> "$tmp/E47Richardson.v" <<'COQ'
          Print Assumptions E47Richardson.step_minimax.
          Print Assumptions E47Richardson.stability_lower.
          Print Assumptions E47Richardson.stability_upper.
          Print Assumptions E47Richardson.slow_sector.
          Print Assumptions E47Richardson.fast_sector.
          Print Assumptions E47Richardson.retained_sector.
          Print Assumptions E47Richardson.normalized_identity.
          Print Assumptions E47Richardson.complement_envelope.
          Print Assumptions E47Richardson.complement_bound_attained.
          COQ
          (cd "$tmp" && coqc -q E47Richardson.v) | tee coq-richardson-assumptions.txt
          test "$(grep -c 'Closed under the global context' coq-richardson-assumptions.txt)" -eq 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coq-richardson-assumptions
          path: coq-richardson-assumptions.txt
