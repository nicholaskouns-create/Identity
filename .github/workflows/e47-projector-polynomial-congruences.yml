name: E47 paired projector polynomial congruences
on:
  pull_request:
    paths:
      - 'formal/e47/unified/ProjectorPolynomialCongruences.lean'
      - 'formal/e47/unified/ProjectorPolynomialCongruences.v'
      - 'validation/e47_projector_polynomial_congruences.py'
      - '.github/workflows/e47-projector-polynomial-congruences.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-congruences:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.19.0
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile all five theorems and audit axioms
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee e47-congruence-lean-commit.txt
          sha256sum formal/e47/unified/ProjectorPolynomialCongruences.lean | tee e47-congruence-lean-sha256.txt
          lean --version | tee e47-congruence-lean-version.txt
          grep -Fq 'Lean (version 4.19.0' e47-congruence-lean-version.txt
          lean formal/e47/unified/ProjectorPolynomialCongruences.lean 2>&1 | tee e47-congruence-lean-log.txt
          for theorem in numerator_coefficients annihilator_coefficients idempotence_polynomial_divisibility kernel_polynomial_divisibility negative_control_rejected; do
            grep -Fq "E47ProjectorCongruences.$theorem" e47-congruence-lean-log.txt
          done
          ! grep -Eq 'sorryAx|admit|unsafe' e47-congruence-lean-log.txt
          ! grep -Eq '\\bsorry\\b|\\baxiom\\b' formal/e47/unified/ProjectorPolynomialCongruences.lean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e47-projector-congruences-lean-unsigned
          path: e47-congruence-lean-*.txt
  coq-congruences:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
      - name: Compile all five theorems and audit assumptions
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee e47-congruence-coq-commit.txt
          sha256sum formal/e47/unified/ProjectorPolynomialCongruences.v | tee e47-congruence-coq-sha256.txt
          coqc --version | tee e47-congruence-coq-version.txt
          grep -Fq 'version 8.18.0' e47-congruence-coq-version.txt
          coqc formal/e47/unified/ProjectorPolynomialCongruences.v 2>&1 | tee e47-congruence-coq-log.txt
          test "$(grep -Fxc 'Closed under the global context' e47-congruence-coq-log.txt)" -eq 5
          ! grep -Eq 'Admitted\\.|Axiom ' formal/e47/unified/ProjectorPolynomialCongruences.v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e47-projector-congruences-coq-unsigned
          path: e47-congruence-coq-*.txt
  exact-integer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent exact long division and negative control
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee e47-congruence-python-commit.txt
          sha256sum validation/e47_projector_polynomial_congruences.py | tee e47-congruence-python-sha256.txt
          python --version | tee e47-congruence-python-version.txt
          python -I validation/e47_projector_polynomial_congruences.py 2>&1 | tee e47-congruence-python-log.txt
          grep -Fq '"status": "E47_PROJECTOR_CONGRUENCES_PASS"' e47-congruence-python-log.txt
          grep -Fq '"negative_control_rejected": true' e47-congruence-python-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e47-projector-congruences-python-unsigned
          path: e47-congruence-python-*.txt
