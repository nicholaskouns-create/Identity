name: E47 generalized Jacobi exact similarity (Lean + Coq)
on:
  push:
    paths:
      - 'formal/e47/E47JacobiGeneral.lean'
      - 'formal/e47/E47JacobiGeneral.v'
      - 'formal/e47/E47RealForm.lean'
      - 'formal/e47/E47RealForm.v'
      - '.github/workflows/e47-jacobi-general.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  generalized-jacobi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: sudo apt-get update -qq && sudo apt-get install -y coq
      - name: Install Lean 4.35.0
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile generalized Jacobi Lean
        run: lean formal/e47/E47JacobiGeneral.lean
      - name: Verify Lean proofs contain no sorry
        run: |
          cp formal/e47/E47JacobiGeneral.lean /tmp/AxCheck.lean
          cat >> /tmp/AxCheck.lean <<'EOT'
          #print axioms E47Jacobi.upper_entry
          #print axioms E47Jacobi.lower_entry
          #print axioms E47Jacobi.diagonal_entry
          #print axioms E47Jacobi.zero_entry
          #print axioms E47Jacobi.jacobi_upper_all
          #print axioms E47Jacobi.jacobi_lower_all
          #print axioms E47Jacobi.conj_mul
          #print axioms E47Jacobi.conj_sub
          #print axioms E47Jacobi.conj_commutator
          #print axioms E47Jacobi.conj_jacobi_entry
          EOT
          lean /tmp/AxCheck.lean | tee /tmp/ax.txt
          if grep -q "sorryAx" /tmp/ax.txt; then
            echo "FAIL: a proof depends on sorry"; exit 1
          fi
          echo "Lean: no sorry; only propext, Classical.choice, Quot.sound."
      - name: Compile generalized Jacobi Coq
        run: |
          cp formal/e47/E47JacobiGeneral.v /tmp/E47JacobiGeneral.v
          cd /tmp
          coqc -q E47JacobiGeneral.v
      - name: Verify Coq proofs are closed under the global context
        run: |
          cd /tmp
          cat > AxCheckQ.v <<'EOT'
          Require Import E47JacobiGeneral.
          Import E47Jacobi.
          Print Assumptions conj_jacobi_entry.
          Print Assumptions conj_commutator.
          Print Assumptions conj_mul.
          Print Assumptions jacobi_upper_all.
          Print Assumptions jacobi_lower_all.
          EOT
          coqc -q -I /tmp AxCheckQ.v | tee /tmp/axq.txt
          if grep -q "Axioms:" /tmp/axq.txt; then
            echo "FAIL: Coq proof depends on an axiom"; exit 1
          fi
          grep -q "Closed under the global context" /tmp/axq.txt
          echo "Coq: closed under the global context; no axioms."
      - name: Compile real-form Lean
        run: lean formal/e47/E47RealForm.lean
      - name: Verify real-form Lean contains no sorry
        run: |
          cp formal/e47/E47RealForm.lean /tmp/RFAx.lean
          cat >> /tmp/RFAx.lean <<'EOT'
          #print axioms E47RealForm.self_neg_zero
          #print axioms E47RealForm.GQ.self_neg_zero
          #print axioms E47RealForm.smulI_skew_isHerm
          #print axioms E47RealForm.herm_skew_zero
          #print axioms E47RealForm.real_form_inter_trivial
          EOT
          lean /tmp/RFAx.lean | tee /tmp/rfax.txt
          if grep -q "sorryAx" /tmp/rfax.txt; then
            echo "FAIL: a real-form proof depends on sorry"; exit 1
          fi
          echo "Lean real form: no sorry."
      - name: Compile real-form Coq and verify assumptions
        run: |
          cp formal/e47/E47RealForm.v /tmp/E47RealForm.v
          cd /tmp
          coqc -q E47RealForm.v
          sed '/^End E47RealForm\.$/d' /tmp/E47RealForm.v > /tmp/RFInline.v
          cat >> /tmp/RFInline.v <<'EOT'
          Print Assumptions self_neg_zero.
          Print Assumptions smulI_skew_isHerm.
          Print Assumptions herm_skew_zero.
          Print Assumptions real_form_inter_trivial.
          End E47RealForm.
          EOT
          coqc -q /tmp/RFInline.v | tee /tmp/rfq.txt
          if grep -q "Axioms:" /tmp/rfq.txt; then
            echo "FAIL: real-form Coq proof depends on an axiom"; exit 1
          fi
          grep -q "Closed under the global context" /tmp/rfq.txt
          echo "Coq real form: closed under the global context."
      - name: Publish compiler status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = "success" ]; then state=success; else state=failure; fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"E47 generalized Jacobi Lean Coq\",\"description\":\"Both compilers must succeed\"}"
