name: Monorail navigation source checks

on:
  pull_request:
    paths:
      - 'monorail/**'
      - '.github/workflows/monorail-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The wider monorail/tests suite includes PostgreSQL and direct-execution
      # harnesses. They run under the route certification workflow, not here.
      # This workflow tests the public navigation source and rendered Tower exit.
      - name: Check Monorail paper source and historical census
        run: python3 -m unittest discover -s monorail/tests -p 'test_paper_pin.py' -v
      - name: Check HTML entity encoding in station and repair links
        run: python3 -m unittest discover -s monorail/tests -p 'test_html_escaping.py' -v

  public-door-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test HTTP evidence classification without network
        run: python3 -m unittest discover -s monorail/tests -p 'test_live_probe.py' -v
      - name: Probe the 17 anonymous public doors
        # A PR is not yet deployed. Preserve the source mismatch in the JSON,
        # but do not fail a PR solely because Pages still serves main.
        # Workflow dispatch remains strict about source-byte parity.
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 monorail/probe_public_doors.py --output monorail/live-door-evidence.json --allow-undeployed-source
          else
            python3 monorail/probe_public_doors.py --output monorail/live-door-evidence.json
          fi
      - name: Preserve observed HTTP statuses and transport errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorail-public-door-http-evidence
          path: monorail/live-door-evidence.json
          if-no-files-found: warn

  catalogued-exit-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify exit scope and private exclusions offline
        run: python3 -m unittest discover -s monorail/tests -p 'test_catalogued_exits.py' -v
      - name: Probe the 51 public catalogued exits (non-gating evidence)
        run: python3 monorail/probe_catalogued_exits.py
      - name: Preserve every observed exit status and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorail-catalogued-exit-http-evidence
          path: monorail/live-exit-evidence.json
          if-no-files-found: warn
