name: E47 Casimir-U column 5 native evaluator audit
on:
  pull_request:
    paths:
      - 'formal/e47/unified/Tensor125CasimirUColumn5Native.lean'
      - 'formal/e47/unified/Tensor125CasimirUColumn5.v'
      - '.github/workflows/e47-casimir-u-column5-native.yml'
  workflow_dispatch:
jobs:
  lean-native-cu5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check exact concrete generator parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('formal/e47/unified')
          canonical = (root/'Tensor125.lean').read_text().split('theorem highest_weight',1)[0]
          native = (root/'Tensor125CasimirUColumn5Native.lean').read_text().removeprefix('import Lean\n').split('/-! ## Concrete',1)[0]
          assert native == canonical, 'Generator definitions differ'
          print('CU5_NATIVE_GENERATOR_PARITY_PASS')
          PY
      - name: Install pinned Lean 4.19.0
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Preserve provenance before expensive computation
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee lean-cu5-native-commit.txt
          sha256sum formal/e47/unified/Tensor125CasimirUColumn5Native.lean | tee lean-cu5-native-source-sha256.txt
          lean --version | tee lean-cu5-native-version.txt
          grep -Fq 'Lean (version 4.19.0' lean-cu5-native-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lean-cu5-native-preflight
          path: lean-cu5-native-*.txt
      - name: Compile and print exact native trust assumptions
        run: |
          set -euo pipefail
          lean formal/e47/unified/Tensor125CasimirUColumn5Native.lean 2>&1 | tee lean-cu5-native-axioms.txt
          grep -Fq 'E47Tensor125.concreteCasimirU_column_four_native' lean-cu5-native-axioms.txt
          grep -Fq '[propext, Lean.ofReduceBool]' lean-cu5-native-axioms.txt
          ! grep -Eq 'sorryAx|admit|unsafe' lean-cu5-native-axioms.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-cu5-native-audit
          path: lean-cu5-native-*.txt
  coq-cu5-crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq 8.18.0
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
      - name: Compile independent Coq column 5 and audit assumptions
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee coq-cu5-native-commit.txt
          sha256sum formal/e47/unified/Tensor125CasimirUColumn5.v | tee coq-cu5-native-source-sha256.txt
          coqc --version | tee coq-cu5-native-version.txt
          grep -Fq 'version 8.18.0' coq-cu5-native-version.txt
          coqc -Q formal/e47/unified E47Tensor formal/e47/unified/Tensor125.v > coq-cu5-native-base.txt 2>&1
          coqc -Q formal/e47/unified E47Tensor formal/e47/unified/Tensor125CasimirUColumn5.v 2>&1 | tee coq-cu5-native-assumptions.txt
          grep -Fxq 'Closed under the global context' coq-cu5-native-assumptions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coq-cu5-native-crosscheck
          path: coq-cu5-native-*.txt
