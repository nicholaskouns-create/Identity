name: E47 formal and matrix validation
on:
  push:
    paths:
      - 'formal/e47/**'
      - 'simulation/validate_e47.py'
      - 'scripts/validate-formal-local.sh'
      - '.github/workflows/e47-formal-validation.yml'
  pull_request:
    paths:
      - 'formal/e47/**'
      - 'simulation/validate_e47.py'
      - 'scripts/validate-formal-local.sh'
      - '.github/workflows/e47-formal-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e47-certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq and Python/NumPy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coq python3 python3-numpy curl ca-certificates
      - name: Install pinned Lean 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile all three proof files and verify 125x125 matrices
        run: bash scripts/validate-formal-local.sh
