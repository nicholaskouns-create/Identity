name: E47 unified scoped certificates
on:
  pull_request:
    paths:
      - 'formal/e47/unified/**'
      - 'validation/e47_tensor_bracket_trace_exact.py'
      - 'validation/e47_independent_crosscheck.py'
      - '.github/workflows/e47-unified-certificates.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4 via elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile seven Lean modules
        run: |
          set -euxo pipefail
          lean --version
          for f in formal/e47/unified/{Core47,RGFixed,Retention,Clock,EncodedOracle,Spin2Generators,Tensor125}.lean; do
            lean "$f"
          done
  coq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
      - name: Compile seven Coq modules
        run: |
          set -euxo pipefail
          coqc --version
          for f in formal/e47/unified/{Core47,RGFixed,Retention,Clock,EncodedOracle,Spin2Generators,Tensor125}.v; do
            coqc "$f"
          done

  integer-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact-matrix test dependency
        run: python -m pip install numpy==2.2.6
      - name: Check concrete integer tensor commutators and Casimir
        run: python validation/e47_tensor_bracket_trace_exact.py

  independent-crosscheck:
    # Deliberately isolated from the job above: no NumPy, no repository
    # imports, no shared basis or number field. Exact two-sided rank over
    # Z[sqrt 6] plus a matrix-free character derivation of the same 47.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enforce the independence claim (stdlib only, nothing from this repo)
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import importlib.util, sys

          target = "validation/e47_independent_crosscheck.py"
          before = set(sys.modules)
          spec = importlib.util.spec_from_file_location("_e47_independent", target)
          mod = importlib.util.module_from_spec(spec)
          sys.modules["_e47_independent"] = mod
          spec.loader.exec_module(mod)

          pulled = {n.split(".")[0] for n in set(sys.modules) - before}
          pulled.discard("_e47_independent")
          foreign = sorted(n for n in pulled if n not in sys.stdlib_module_names)
          if foreign:
              print(f"FAIL independence: instrument pulled in {foreign}")
              sys.exit(1)
          print(f"independence holds: {len(pulled)} modules loaded, all stdlib")
          PY
      - name: Independent exact cross-check of dim ker K = 47
        run: python -I validation/e47_independent_crosscheck.py
