name: E47 unified scoped certificates
on:
  pull_request:
    paths:
      - 'formal/e47/unified/**'
      - 'validation/e47_tensor_bracket_trace_exact.py'
      - '.github/workflows/e47-unified-certificates.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4 via elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile seven Lean modules
        run: |
          set -euxo pipefail
          lean --version
          for f in formal/e47/unified/{Core47,RGFixed,Retention,Clock,EncodedOracle,Spin2Generators,Tensor125}.lean; do
            lean "$f"
          done
  coq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
      - name: Compile seven Coq modules
        run: |
          set -euxo pipefail
          coqc --version
          for f in formal/e47/unified/{Core47,RGFixed,Retention,Clock,EncodedOracle,Spin2Generators,Tensor125}.v; do
            coqc "$f"
          done

  integer-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact-matrix test dependency
        run: python -m pip install numpy==2.2.6
      - name: Check concrete integer tensor commutators and Casimir
        run: python validation/e47_tensor_bracket_trace_exact.py

  lean-columns-65-69:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit shared concrete spin-2 generator definitions
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('formal/e47/unified')
          original = (root / 'Tensor125.lean').read_text().split('theorem highest_weight', 1)[0]
          isolated = (root / 'Tensor125Columns65to69.lean').read_text().split('/-! ## Isolated', 1)[0]
          assert original == isolated, '65..69 generator definitions drifted from original'
          print('SPIN2_COLUMNS_65_69_SHARED_DEFINITIONS_MATCH')
          PY
      - name: Install Lean 4.19.0 via elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact 625-entry bracket and audit axioms
        run: |
          set -euxo pipefail
          lean --version
          lean formal/e47/unified/Tensor125Columns65to69.lean

  lean-columns-70-74:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit shared concrete spin-2 generator definitions
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('formal/e47/unified')
          original = (root / 'Tensor125.lean').read_text().split('theorem highest_weight', 1)[0]
          isolated = (root / 'Tensor125Columns70to74.lean').read_text().split('/-! ## Isolated', 1)[0]
          assert original == isolated, '70..74 generator definitions drifted from original'
          print('SPIN2_COLUMNS_70_74_SHARED_DEFINITIONS_MATCH')
          PY
      - name: Install Lean 4.19.0 via elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact 625-entry bracket and audit axioms
        run: |
          set -euxo pipefail
          lean --version
          lean formal/e47/unified/Tensor125Columns70to74.lean
