name: E47 unified scoped certificates
on:
  pull_request:
    paths:
      - 'formal/e47/unified/**'
      - 'validation/e47_tensor_bracket_trace_exact.py'
      - '.github/workflows/e47-unified-certificates.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4 via elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile nine Lean modules
        run: |
          set -euxo pipefail
          lean --version
          for f in formal/e47/unified/{Core47,RGFixed,Retention,Clock,EncodedOracle,Spin2Generators,Tensor125,SpectralMask128,DiagonalKernelBridge}.lean; do
            lean "$f"
          done
  coq:
    runs-on: ubuntu-24.04
    container:
      image: coqorg/coq:8.20.1
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Compile nine Coq modules (container-pinned 8.20.1)
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="/home/coq/.opam/${COMPILER}/bin:$PATH"
          command -v coqc
          coqc --version
          coqc --version | grep -F 'version 8.20.1'
          for f in formal/e47/unified/{Core47,RGFixed,Retention,Clock,EncodedOracle,Spin2Generators,Tensor125,SpectralMask128,DiagonalKernelBridge}.v; do
            coqc "$f"
          done

  integer-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact-matrix test dependency
        run: python -m pip install numpy==2.2.6
      - name: Check concrete integer tensor commutators and Casimir
        run: python validation/e47_tensor_bracket_trace_exact.py
