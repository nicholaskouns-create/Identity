name: E47 exact Lie rank certificates (Lean + Coq)
on:
  push:
    paths:
      - 'formal/e47/E47LieClosure.lean'
      - 'formal/e47/E47LieClosure.v'
      - '.github/workflows/e47-lie-closure.yml'
  pull_request:
    paths:
      - 'formal/e47/E47LieClosure.lean'
      - 'formal/e47/E47LieClosure.v'
      - '.github/workflows/e47-lie-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank-witness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: sudo apt-get update -qq && sudo apt-get install -y coq
      - name: Install Lean 4.35.0
        run: |
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile finite-field inverse witness in Lean
        run: lean formal/e47/E47LieClosure.lean
      - name: Compile finite-field inverse witness in Coq
        run: |
          cp formal/e47/E47LieClosure.v /tmp/E47LieClosure.v
          cd /tmp
          coqc -q E47LieClosure.v
