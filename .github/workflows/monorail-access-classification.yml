name: Monorail restricted-access navigation
on:
  pull_request:
    paths:
      - 'monorail/index.html'
      - 'tests/test_monorail_access_classification.py'
      - '.github/workflows/monorail-access-classification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historical census and restricted navigation regression
        run: python -m unittest discover -s tests -p 'test_monorail_access_classification.py' -v
