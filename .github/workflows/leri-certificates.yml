name: LERI — Python, statevector, Lean and Coq
on:
  push:
    branches: [main]
    paths:
      - 'leri/**'
      - '.github/workflows/leri-certificates.yml'
  pull_request:
    paths:
      - 'leri/**'
      - '.github/workflows/leri-certificates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-quantum:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.16.3
      - name: Execute first-principles and eight-qubit statevector validation
        run: python leri/validate.py
      - name: Check publication artifacts
        shell: bash
        run: |
          test -s leri/index.html
          test -s site/leri/index.html
          test -s leri/PROOF.md
          test -s leri/source/LERI_Gaps_Closed_extracted.txt
          test -s leri/source/LERI_First_Principles_Proof_extracted.txt
          test -s leri/results.txt

  lean-finite-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.19.0
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact finite-sector theorems
        run: |
          lean --version
          lean leri/formal/LERI_Exact.lean

  coq-finite-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coq
      - name: Compile exact finite-sector theorems
        run: |
          coqc --version
          coqc leri/formal/LERI_Exact.v
