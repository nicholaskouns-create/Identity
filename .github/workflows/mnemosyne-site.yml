name: Mnemosyne verify and publish
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/mnemosyne-site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnemosyne-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check site/mnemosyne.js
      - run: node --check site/forge-engine.js
      - run: node --check site/forge-ui.js
      - run: node tools/test-forge.mjs
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/check_site.py
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
