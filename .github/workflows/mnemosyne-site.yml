name: Mnemosyne verify and publish
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'simulation/**'
      - 'infra/ingestion/**'
      - '.github/workflows/mnemosyne-site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mnemosyne-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - run: npm install --prefix /tmp/identity-test-deps fake-indexeddb@6.2.4
      - run: python simulation/validate_e47.py
      - run: python simulation/e47_tqgnn/run.py
      - run: python -m unittest discover -s infra/ingestion -v
      - run: node tools/test-archive.cjs
        env:
          NODE_PATH: /tmp/identity-test-deps/node_modules
      - run: node --check site/mnemosyne.js
      - run: node --check site/sync.js
      - run: node --check site/sync-merge.js
      - run: node tools/test-sync.mjs
      - run: node --check site/forge-engine.js
      - run: node --check site/forge-ui.js
      - run: node tools/test-forge.mjs
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/check_site.py
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          echo "Pages build_type=$build"
          test "$build" = "workflow"
      - if: steps.pages.outcome == 'success'
        uses: actions/configure-pages@v5
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - if: steps.pages.outcome != 'success'
        run: echo "::notice::Verification passed. Pages is not using a GitHub Actions source, so this workflow did not publish. The live site follows the branch set in Pages settings."
