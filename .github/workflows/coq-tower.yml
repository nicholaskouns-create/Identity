name: Coq tower certificate
on:
  push:
    paths:
      - 'formal/e47/TowerIdentity.v'
      - 'formal/e47/E47WeightAlgebra.v'
      - 'formal/e47/E47TowerKernel.v'
      - 'formal/e47/E47OddsContraction.v'
      - '.github/workflows/coq-tower.yml'
  workflow_dispatch:
jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: sudo apt-get update -qq && sudo apt-get install -y coq
      - name: Compile tower theorem with Coq kernel
        run: coqc -q formal/e47/TowerIdentity.v
      - name: Compile weight-algebra certificate with Coq kernel
        run: |
          mkdir -p /tmp/wa && cp formal/e47/E47WeightAlgebra.v /tmp/wa/
          cd /tmp/wa && coqc -q E47WeightAlgebra.v
      - name: Compile tower-kernel link certificate with Coq kernel
        run: |
          mkdir -p /tmp/tk && cp formal/e47/E47TowerKernel.v /tmp/tk/
          cd /tmp/tk && coqc -q E47TowerKernel.v
      - name: Compile odds-contraction lemma with Coq kernel
        run: |
          mkdir -p /tmp/oc && cp formal/e47/E47OddsContraction.v /tmp/oc/
          cd /tmp/oc && coqc -q E47OddsContraction.v
