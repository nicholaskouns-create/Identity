name: Grid Radar Browser End-to-End
on:
  push:
    paths:
      - '.github/workflows/grid-radar-browser-smoke.yml'
      - 'grid/radar/**'
      - 'grid/live/multimodal.js'
      - 'tools/grid/test_multimodal_browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve exact checked-out application
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/grid-http.log 2>&1 &
          sleep 3
          curl --fail --silent http://127.0.0.1:8765/grid/radar/ >/dev/null
      - name: Run headless browser integration with synthetic publisher fixtures
        run: node tools/grid/test_multimodal_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multimodal-radar-browser-smoke
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
