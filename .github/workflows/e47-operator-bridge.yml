name: E47 symbolic certificate candidates
on:
  pull_request:
    paths:
      - 'formal/e47/operator-bridge/**'
      - '.github/workflows/e47-operator-bridge.yml'
  workflow_dispatch:
jobs:
  lean-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact certificates
        run: |
          set -euxo pipefail
          lean --version
          lean formal/e47/operator-bridge/E47IntPoly.lean
          lean formal/e47/operator-bridge/SigillumOrbit.lean
      - name: Reject unproved placeholders
        run: |
          if grep -nE '\\b(sorry|admit|axiom)\\b' formal/e47/operator-bridge/*.lean; then exit 1; fi
