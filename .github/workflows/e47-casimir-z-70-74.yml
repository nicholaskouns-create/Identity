name: E47 concrete Casimir-Z 70-74 paired receipt
on:
  pull_request:
    paths:
      - 'formal/e47/unified/Tensor125CasimirZ70to74.lean'
      - 'formal/e47/unified/Tensor125.v'
      - '.github/workflows/e47-casimir-z-70-74.yml'
  workflow_dispatch:
jobs:
  lean-casimir-z-70-74:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify generator definition identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('formal/e47/unified')
          original = (root / 'Tensor125.lean').read_text().split('theorem highest_weight', 1)[0]
          isolated = (root / 'Tensor125CasimirZ70to74.lean').read_text().split('/-! ## Isolated', 1)[0]
          assert original == isolated, '125-state generator definitions diverged'
          print('CASIMIR_Z_70_74_GENERATOR_PARITY_PASS')
          PY
      - name: Install pinned Lean 4.19.0
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact 625-entry theorem and audit axioms
        run: |
          set -euo pipefail
          lean --version | tee lean-70-74-version.txt
          grep -Fq 'Lean (version 4.19.0' lean-70-74-version.txt
          lean formal/e47/unified/Tensor125CasimirZ70to74.lean | tee lean-70-74-axioms.txt
          grep -Fq "'E47Tensor125.concreteCasimirZ_columns_seventy_through_seventyfour' depends on axioms: [propext]" lean-70-74-axioms.txt
          sha256sum formal/e47/unified/Tensor125CasimirZ70to74.lean > lean-70-74-sha256.txt
          git rev-parse HEAD > lean-70-74-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-casimir-z-70-74-proof-audit
          path: |
            lean-70-74-version.txt
            lean-70-74-axioms.txt
            lean-70-74-sha256.txt
            lean-70-74-commit.txt

  coq-casimir-z-70-74:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq 8.18.0
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
      - name: Compile concrete Coq theorem and audit assumptions
        run: |
          set -euo pipefail
          coqc --version | tee coq-70-74-version.txt
          grep -Fq 'version 8.18.0' coq-70-74-version.txt
          coqc formal/e47/unified/Tensor125.v | tee coq-70-74-assumptions.txt
          test "$(grep -c '^Closed under the global context$' coq-70-74-assumptions.txt)" -eq "$(grep -c '^Print Assumptions ' formal/e47/unified/Tensor125.v)"
          sha256sum formal/e47/unified/Tensor125.v > coq-70-74-sha256.txt
          git rev-parse HEAD > coq-70-74-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coq-casimir-z-70-74-assumption-audit
          path: |
            coq-70-74-version.txt
            coq-70-74-assumptions.txt
            coq-70-74-sha256.txt
            coq-70-74-commit.txt
