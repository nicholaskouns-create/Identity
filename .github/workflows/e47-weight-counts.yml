name: E47 weight-count generating-function Lean certificate
on:
  pull_request:
    paths:
      - 'formal/e47/unified/E47WeightCounts.lean'
      - '.github/workflows/e47-weight-counts.yml'
  workflow_dispatch:
jobs:
  weight-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.19.0
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile generating-function and weight-count theorems
        run: |
          set -euxo pipefail
          lean --version
          lean formal/e47/unified/E47WeightCounts.lean
