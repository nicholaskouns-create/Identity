name: KKP-R E47 Certainty Cycle - Lean Coq and NumPy
on:
  push:
    paths:
      - 'formal/e47/KKPRCertaintyCycle.lean'
      - 'formal/e47/KKPRCertaintyCycle.v'
      - 'research/kkpr_certainty_cycle.py'
      - '.github/workflows/kkpr-certainty-cycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coq
      - name: Install pinned Lean 4.35
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install NumPy and SciPy
        run: python -m pip install numpy scipy
      - name: Compiler versions
        run: |
          mkdir -p proof-results/kkpr-certainty-cycle
          lean --version | tee proof-results/kkpr-certainty-cycle/lean-version.txt
          coqc --version | tee proof-results/kkpr-certainty-cycle/coq-version.txt
      - name: Lean compile
        run: |
          set -o pipefail
          lean formal/e47/KKPRCertaintyCycle.lean 2>&1 | tee proof-results/kkpr-certainty-cycle/lean.log
      - name: Coq compile and assumption report
        run: |
          set -o pipefail
          coqc -q formal/e47/KKPRCertaintyCycle.v 2>&1 | tee proof-results/kkpr-certainty-cycle/coq.log
      - name: Concrete 125-to-47 cycle numerical test
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -o pipefail
          python research/kkpr_certainty_cycle.py 2>&1 | tee proof-results/kkpr-certainty-cycle/python.log
          cp research/kkpr_certainty_cycle_results.json proof-results/kkpr-certainty-cycle/
      - name: Upload independently inspectable proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kkpr-certainty-cycle-lean-coq-python
          path: proof-results/kkpr-certainty-cycle/
          if-no-files-found: warn
