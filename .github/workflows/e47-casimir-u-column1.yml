name: E47 concrete Casimir-U column 1 paired receipt
on:
  pull_request:
    paths:
      - 'formal/e47/unified/Tensor125CasimirUColumn1.lean'
      - 'formal/e47/unified/Tensor125CasimirUColumn1.v'
      - '.github/workflows/e47-casimir-u-column1.yml'
  workflow_dispatch:
jobs:
  lean-casimir-u-column1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify generator definition identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('formal/e47/unified')
          canonical = (root / 'Tensor125.lean').read_text().split('theorem highest_weight', 1)[0]
          isolated = (root / 'Tensor125CasimirUColumn1.lean').read_text().split('/-! ## Concrete', 1)[0]
          assert canonical == isolated, 'Concrete generator definitions diverged'
          print('CASIMIR_U_COLUMN1_GENERATOR_PARITY_PASS')
          PY
      - name: Install Lean 4.19.0
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and audit concrete theorem
        run: |
          set -euo pipefail
          git rev-parse HEAD > lean-cu1-commit.txt
          sha256sum formal/e47/unified/Tensor125CasimirUColumn1.lean > lean-cu1-source-sha256.txt
          lean --version | tee lean-cu1-version.txt
          grep -Fq 'Lean (version 4.19.0' lean-cu1-version.txt
          lean formal/e47/unified/Tensor125CasimirUColumn1.lean 2>&1 | tee lean-cu1-axioms.txt
          grep -Fq 'E47Tensor125.concreteCasimirU_column_one' lean-cu1-axioms.txt
          ! grep -Eq 'sorryAx|admit|unsafe' lean-cu1-axioms.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-cu1-provenance
          path: lean-cu1-*.txt
  coq-casimir-u-column1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Coq 8.18.0
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
      - name: Compile and audit concrete theorem
        run: |
          set -euo pipefail
          git rev-parse HEAD > coq-cu1-commit.txt
          sha256sum formal/e47/unified/Tensor125CasimirUColumn1.v > coq-cu1-source-sha256.txt
          coqc --version | tee coq-cu1-version.txt
          grep -Fq 'version 8.18.0' coq-cu1-version.txt
          coqc -Q formal/e47/unified E47Tensor formal/e47/unified/Tensor125.v > coq-cu1-base.txt 2>&1
          coqc -Q formal/e47/unified E47Tensor formal/e47/unified/Tensor125CasimirUColumn1.v 2>&1 | tee coq-cu1-assumptions.txt
          grep -Fxq 'Closed under the global context' coq-cu1-assumptions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coq-cu1-provenance
          path: coq-cu1-*.txt
